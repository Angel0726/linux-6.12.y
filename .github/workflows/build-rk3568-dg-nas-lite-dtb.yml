# .github/workflows/build-rk3568-dg-nas-lite-dtb.yml
name: Build RK3568 DG-NAS-Lite DTB (Debug)

on:
  push:
    branches: [ main ]
    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts'
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtsi'
      - 'arch/arm64/boot/dts/rockchip/Makefile'
      - 'arch/arm64/configs/defconfig'
      - '.github/workflows/build-rk3568-dg-nas-lite-dtb.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts'
      - 'arch/arm64/boot/dts/rockchip/Makefile'
  workflow_dispatch:

concurrency:
  group: dtb-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-dtb:
    name: Compile rk3568-dg-nas-lite.dtb
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev libncurses-dev \
            lz4 zstd \
            gcc-aarch64-linux-gnu \
            device-tree-compiler

      - name: Generate .config (arm64 defconfig)
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

      - name: 1. Print ROCKCHIP Configs
        run: |
          echo "=== Checking .config for ARCH_ROCKCHIP ==="
          grep -E 'CONFIG_ARCH_ROCKCHIP' .config || echo "CONFIG_ARCH_ROCKCHIP not found!"

      - name: 2. Print Original rockchip Makefile
        run: |
          echo "=== Original arch/arm64/boot/dts/rockchip/Makefile ==="
          cat arch/arm64/boot/dts/rockchip/Makefile

      - name: 3. Register DTB in rockchip Makefile
        run: |
          MAKEFILE=arch/arm64/boot/dts/rockchip/Makefile
          if ! grep -q "rk3568-dg-nas-lite.dtb" "$MAKEFILE"; then
            # 确保转义正确，写入的是字面量 $(CONFIG_ARCH_ROCKCHIP)
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-dg-nas-lite.dtb' >> "$MAKEFILE"
            echo "Added rk3568-dg-nas-lite.dtb to $MAKEFILE"
          else
            echo "rk3568-dg-nas-lite.dtb already registered."
          fi

      - name: 4. Print Modified rockchip Makefile
        run: |
          echo "=== Modified arch/arm64/boot/dts/rockchip/Makefile ==="
          cat arch/arm64/boot/dts/rockchip/Makefile

      - name: 5. Build Target DTB with Verbose Output (V=1)
        run: |
          # 使用 V=1 打印详细的执行命令
          # 直接编译指定目标，看它到底在哪里报错
          make V=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb

      - name: 6. Verify output
        run: |
          ls -lh arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb
          dtc -I dtb -O dts \
              arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb \
              -o /tmp/rk3568-dg-nas-lite.verify.dts
          head -n 30 /tmp/rk3568-dg-nas-lite.verify.dts

      - name: 7. Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3568-dg-nas-lite-dtb
          path: arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb
          if-no-files-found: warn
          retention-days: 30
