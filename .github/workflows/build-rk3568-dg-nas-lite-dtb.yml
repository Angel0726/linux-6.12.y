name: Build RK3568 DG-NAS-Lite DTB

on:
  push:
    branches: [ main ]
    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts'
      - 'arch/arm64/boot/dts/rockchip/rk3568.dtsi'
      - 'arch/arm64/boot/dts/rockchip/Makefile'
      - 'arch/arm64/configs/defconfig'
      - '.github/workflows/build-rk3568-dg-nas-lite-dtb.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts'
      - 'arch/arm64/boot/dts/rockchip/Makefile'
  workflow_dispatch:

concurrency:
  group: dtb-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-dtb:
    name: Compile rk3568-dg-nas-lite.dtb
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev libncurses-dev \
            lz4 zstd \
            gcc-aarch64-linux-gnu \
            device-tree-compiler

      - name: Build DTC Tool
        # 我们只需要内核自带的 dtc 编译器和预处理头文件
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts

      - name: Build Target DTB (Manual Compilation)
        run: |
          # 定义源文件和输出文件
          DTS_FILE="arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts"
          DTB_FILE="arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb"
          
          # 定义包含路径
          INCLUDES="-I./arch/arm64/boot/dts -I./include -I./scripts/dtc/include-prefixes"
          
          echo "🔨 Preprocessing $DTS_FILE..."
          # 1. 使用 gcc 预处理 dts 文件 (处理 #include, #define 等)
          #    -E: 只预处理
          #    -P: 不生成 #line 指令
          #    -x assembler-with-cpp: 指定输入为汇编风格的 C 代码
          #    -undef: 取消预定义的非标准宏
          #    -D__DTS__: 定义 DTS 宏
          gcc -E -P -x assembler-with-cpp -undef -D__DTS__ $INCLUDES $DTS_FILE -o /tmp/preprocessed.dts
          
          echo "🔨 Compiling to $DTB_FILE..."
          # 2. 使用内核自带的 dtc 编译
          #    -I dts: 输入格式
          #    -O dtb: 输出格式
          #    -o: 输出文件
          #    -@: 生成符号信息 (支持设备树插件/overlay)
          #    -Wno-unit_address_vs_reg: 忽略常见的寄存器地址警告 (可选)
          ./scripts/dtc/dtc -I dts -O dtb -o $DTB_FILE -@ -Wno-unit_address_vs_reg /tmp/preprocessed.dts
          
          echo "✅ Build complete."

      - name: Verify output
        run: |
          ls -lh arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb
          dtc -I dtb -O dts \
              arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb \
              -o /tmp/rk3568-dg-nas-lite.verify.dts
          head -n 30 /tmp/rk3568-dg-nas-lite.verify.dts

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3568-dg-nas-lite-dtb
          path: arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb
          if-no-files-found: error
          retention-days: 30
