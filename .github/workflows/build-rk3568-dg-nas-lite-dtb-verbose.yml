name: Build RK3568 DG-NAS-Lite DTB

on:
  push:
    branches: [ main ]
    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts'
      - 'arch/arm64/boot/dts/rockchip/rk3568.dtsi'
      - 'arch/arm64/boot/dts/rockchip/rk3568-vngpu.dtsi'
      - 'arch/arm64/boot/dts/rockchip/rk3568-vngpu-rk809.dtsi'
      - 'arch/arm64/boot/dts/rockchip/rk3568-ramoops.dtsi'
      - 'arch/arm64/boot/dts/rockchip/Makefile'
      - 'arch/arm64/configs/defconfig'
      - '.github/workflows/build-rk3568-dg-nas-lite-dtb.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts'
      - 'arch/arm64/boot/dts/rockchip/*.dtsi'
      - 'arch/arm64/boot/dts/rockchip/Makefile'
  workflow_dispatch:

concurrency:
  group: dtb-${{ github.ref }}-${{ github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-dtb:
    name: Compile rk3568-dg-nas-lite.dtb
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev libncurses-dev \
            lz4 zstd \
            gcc-aarch64-linux-gnu \
            device-tree-compiler

      - name: Build Environment Setup
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts

      - name: Build Target DTB (Manual Compilation)
        run: |
          # 定义变量
          DTS_FILE="arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dts"
          DTB_FILE="arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb"
          TMP_FILE="/tmp/preprocessed.dts"
          LOG_FILE="/tmp/dtc_error.log"
          INCLUDES="-I./arch/arm64/boot/dts -I./include -I./scripts/dtc/include-prefixes"
          
          echo "🔨 Step 1: Preprocessing $DTS_FILE..."
          gcc -E -P -x assembler-with-cpp -undef -D__DTS__ $INCLUDES $DTS_FILE -o $TMP_FILE
          
          echo "🔨 Step 2: Compiling to $DTB_FILE..."
          
          # 核心修改：使用 || 来捕获错误，确保在 set -e 环境下也能执行调试代码
          # 即使 dtc 失败，|| 后面的代码块也会执行
          ./scripts/dtc/dtc -I dts -O dtb -o $DTB_FILE -@ -Wno-unit_address_vs_reg $TMP_FILE 2>&1 | tee $LOG_FILE || {
            echo "❌ DTC Compilation failed. Analyzing error context..."
            
            # 提取错误行号 (使用 sed 兼容性更好)
            # 错误格式: Error: /tmp/preprocessed.dts:5561.2-6 ...
            LINE_NUM=$(sed -n 's/.*preprocessed.dts:\([0-9]*\).*/\1/p' $LOG_FILE | head -1)
            
            if [ -n "$LINE_NUM" ] && [ "$LINE_NUM" -gt 0 ]; then
              echo "🔍 错误发生在第 $LINE_NUM 行，显示前后 10 行代码："
              echo "--------------------------------------------------"
              # 计算起始行（防止小于1）
              START=$((LINE_NUM - 10))
              [ $START -lt 1 ] && START=1
              # 打印出错位置附近的代码，带行号
              sed -n "${START},$((LINE_NUM + 10))p" $TMP_FILE | cat -n
              echo "--------------------------------------------------"
              echo "💡 提示：请检查上面显示的代码段，通常是因为节点定义放在了根节点 }; 之外，或者括号不匹配。"
            else
              echo "无法解析具体行号，显示文件末尾内容："
              tail -n 50 $TMP_FILE
            fi
            
            # 打印完毕后，显式退出并报错
            exit 1
          }
          
          echo "✅ Build complete."

      - name: Verify output
        run: |
          ls -lh arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb
          dtc -I dtb -O dts \
              arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb \
              -o /tmp/rk3568-dg-nas-lite.verify.dts
          head -n 30 /tmp/rk3568-dg-nas-lite.verify.dts

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3568-dg-nas-lite-dtb
          path: arch/arm64/boot/dts/rockchip/rk3568-dg-nas-lite.dtb
          if-no-files-found: error
          retention-days: 30
